      border: 1px solid #334155;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);

      width: 60px;
      height: 60px;
      margin: 0 auto 16px;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(37, 99, 235, 0.3);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .auth-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    .auth-desc {
      font-size: 13.5px;
      color: #94a3b8;
      line-height: 1.55;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 14px;
      position: relative;
    }
    .pass-input {
      width: 100%;
      padding: 14px 16px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 12px;
      color: #f8fafc;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }
    .pass-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    .unlock-btn {
      width: 100%;
      padding: 14px 20px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .unlock-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    .unlock-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error-msg {
      display: none;
      font-size: 13px;
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .footer-links {
      margin-top: 24px;
      font-size: 12.5px;
      color: #64748b;
    }
    .footer-links a {
      color: #60a5fa;
      text-decoration: none;
    }
    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>

        throw new Error("Argon2 WASM engine not loaded");
      }
      const keyHex = await hashwasm.argon2id({
        password: passcode,
        salt: salt,
        parallelism: 1,
        iterations: 2,
        memorySize: 19456,
        hashLength: 32,
        outputType: "hex"
      });
      const match = keyHex.match(/.{1,2}/g);
      return new Uint8Array(match.map(byte => parseInt(byte, 16)));
    }

    async function decryptDoc(passcode) {
      const raw = base64ToBytes(CIPHER_PAYLOAD);
      const salt = raw.slice(0, 16);
      const iv = raw.slice(16, 28);
      const data = raw.slice(28);

      const rawKey = await deriveArgon2Key(passcode, salt);
      const cryptoKey = await crypto.subtle.importKey("raw", rawKey, { name: "AES-GCM" }, false, ["decrypt"]);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, cryptoKey, data);
      return new TextDecoder().decode(decrypted);
    }

    async function renderDecrypted(html, passcode) {
      sessionStorage.setItem("zap_docs_session_key", passcode);
      document.open();
      document.write(html);
      document.close();
    }

    async function handleUnlock(presetPasscode) {
      const input = document.getElementById("passcode-field");
      const btn = document.getElementById("submit-btn");
      const err = document.getElementById("error-box");
      const passcode = presetPasscode || (input ? input.value : "").trim();

      if (!passcode) return;

      if (btn) {
        btn.disabled = true;
        btn.textContent = "Verifying Argon2id...";
      }
      if (err) err.style.display = "none";

      try {
        const html = await decryptDoc(passcode);
        if (html && (html.includes("<!DOCTYPE") || html.includes("<html"))) {
          renderDecrypted(html, passcode);
          return;
        } else {
          throw new Error("Decrypted content invalid");
        }
      } catch (e) {
        if (err) {
          err.style.display = "block";
          err.textContent = "❌ Invalid Passcode. Access denied.";
        }
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Decrypt Documentation 🔓";
        }
        if (input) {
          input.value = "";
          input.focus();
        }
      }
    }

    // Auto unlock if active session exists in sessionStorage
    (function() {
      const saved = sessionStorage.getItem("zap_docs_session_key");
      if (saved) {
        window.addEventListener("DOMContentLoaded", () => handleUnlock(saved));
      }
    })();
  </script>
