name: Auto Scan Java Controllers & Sync API Catalog (Poly-Repo)

on:
  push:
    branches:
      - main
      - uat
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-apis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout System Docs Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 🔐 1. Checkout identity-service Repo
      - name: Checkout identity-service Repo
        uses: actions/checkout@v4
        with:
          repository: 'Ryan181296/identity-service'
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: 'backend/identity-service'
        continue-on-error: true

      # 🔐 2. Checkout commerce-service Repo
      - name: Checkout commerce-service Repo
        uses: actions/checkout@v4
        with:
          repository: 'Ryan181296/commerce-service'
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: 'backend/commerce-service'
        continue-on-error: true

      # 🔐 3. Checkout payment-service Repo
      - name: Checkout payment-service Repo
        uses: actions/checkout@v4
        with:
          repository: 'Ryan181296/payment-service'
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: 'backend/payment-service'
        continue-on-error: true

      # 🔐 4. Checkout notification-service Repo
      - name: Checkout notification-service Repo
        uses: actions/checkout@v4
        with:
          repository: 'Ryan181296/notification-service'
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: 'backend/notification-service'
        continue-on-error: true

      # 🔐 5. Checkout api-gateway Repo
      - name: Checkout api-gateway Repo
        uses: actions/checkout@v4
        with:
          repository: 'Ryan181296/api-gateway'
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: 'backend/api-gateway'
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Java Controller Scanner on Poly-Repo Backend
        run: |
          python3 scripts/scan_controllers.py

      - name: Commit and Push Updated API Catalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/api-data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(api): auto-sync scanned Java API endpoints from Poly-Repo BEs [skip ci]" && git pull --rebase origin main && git push origin main)
