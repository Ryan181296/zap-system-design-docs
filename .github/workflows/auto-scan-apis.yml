name: Auto Scan Java Controllers & Sync API Catalog

on:
  push:
    branches:
      - main
      - uat
  workflow_dispatch:

jobs:
  scan-apis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout System Docs Repo
        uses: actions/checkout@v3

      # 🔐 Checkout Real Backend Source Code Repository using GitHub Secret Token
      - name: Checkout Backend Private Repository (BE Source Code)
        uses: actions/checkout@v3
        with:
          repository: 'Ryan181296/zap-system'
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: 'backend'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Java Controller Scanner on Backend
        run: |
          python3 scripts/scan_controllers.py

      - name: Commit and Push Updated API Catalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/api-data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(api): auto-sync scanned Java API endpoints from BE Repos [skip ci]" && git push)
