server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable Nginx automatic directory redirects and internal port leaks
    absolute_redirect off;
    port_in_redirect off;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Force HTTPS scheme when proxied behind GCP Load Balancer
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Direct exact route for /terms-and-conditions (without trailing slash)
    location = /terms-and-conditions {
        try_files /terms-and-conditions.html =404;
    }

    # Direct exact route for /terms-and-conditions/ (with trailing slash)
    location = /terms-and-conditions/ {
        try_files /terms-and-conditions.html =404;
    }

    # Direct exact route for /privacy-policy (without trailing slash)
    location = /privacy-policy {
        try_files /privacy-policy.html =404;
    }

    # Direct exact route for /privacy-policy/ (with trailing slash)
    location = /privacy-policy/ {
        try_files /privacy-policy.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
