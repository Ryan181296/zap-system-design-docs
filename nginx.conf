server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable Nginx automatic directory redirects and internal port leaks
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Serve Terms of Service directly without any redirect for all URL variants
    location ~* ^/(terms-and-conditions|terms-of-service|terms)(/.*)?$ {
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /terms-and-conditions.html =404;
    }

    # Serve Privacy Policy directly without any redirect for all URL variants
    location ~* ^/(privacy-policy|privacy)(/.*)?$ {
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files /privacy-policy.html =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
